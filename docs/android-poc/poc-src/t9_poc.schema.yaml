# 自写 T9 PoC schema（无第三方版权内容）
schema:
  schema_id: t9_poc
  name: "T9九键PoC"
  version: "0.1"

engine:
  processors:
    - speller
    - selector
    - navigator
    - express_editor
  segmentors:
    - abc_segmentor
    - fallback_segmentor
  translators:
    - script_translator

speller:
  alphabet: "23456789"
  delimiter: " '"
  algebra:
    - xlit/abcdefghijklmnopqrstuvwxyz/22233344455566677778889999/

abc_segmentor:
  extra_tags:
    - reverse_lookup

translator:
  dictionary: luna_pinyin
  prism: t9_poc
  preedit_format: []

simplifier:
  option_name: simplification
  opencc_config: t2s.json

switches:
  - name: simplification
    reset: 1
