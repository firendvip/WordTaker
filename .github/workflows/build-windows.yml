name: Build Windows

# 在 windows-latest runner 上产出真正的 Windows .exe（本地 Mac 无 Wine 无法产出）。
# 仅手动触发，产出未签名的短期验收工件；本 workflow 永不创建 Release 或发布生产资产。
#
# 矩阵：arch ∈ {x64, arm64}。两个架构均为纯 SenseVoice ONNX 路径（NO torch/funasr）：
#   - x64：embedded x86_64 CPython + numpy/onnxruntime/soundfile（win_amd64 轮子），
#          自纯 ONNX 切换起装机包大幅瘦身（原 torch 路径 ~611M）。
#   - arm64：aarch64 CPython + 同一依赖清单（win_arm64 轮子），
#            修复 Windows-on-ARM 上 torch 缺 win-arm64 轮子导致的 0xc0000017 启动崩溃。
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm run prepare:electron-runtime
      - run: pnpm exec electron-rebuild -f -w better-sqlite3 -w uiohook-napi --arch x64
      - run: pnpm run verify:desktop-release
      - run: pnpm run test:auth:coverage
      - run: pnpm run test:desktop:coverage
      - run: pnpm test
      - run: pnpm run build:renderer
      - run: pnpm audit --audit-level high
      - run: pnpm run smoke:electron-runtime

  verify-arm64-runtime:
    needs: verify
    runs-on: windows-11-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm run prepare:electron-runtime
      - run: pnpm exec electron-rebuild -f -w better-sqlite3 -w uiohook-napi --arch arm64
      - run: pnpm run verify:desktop-release
      - run: pnpm run smoke:electron-runtime

  build-win:
    needs: [verify, verify-arm64-runtime]
    runs-on: windows-latest
    timeout-minutes: 90

    strategy:
      # 一个 arch 失败不连累另一个（x64 必须保持可发布，即便 arm64 实验构建失败）。
      fail-fast: false
      matrix:
        arch: [x64, arm64]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # 仓库只有 pnpm-lock.yaml（无 package-lock.json），故用 pnpm 而非 npm ci。
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.3

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-${{ matrix.arch }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.arch }}-pnpm-store-

      # 嵌入式 Python 构建脚本要用 pip 装依赖，需要一个本机 Python 3.11 跑 pip。
      # 注意：runner 本身是 x64，这里的 host Python 仅用于驱动 pip --target 安装到嵌入式目录；
      # arm64 依赖通过 --only-binary=all 取 win_arm64 轮子（onnxruntime/numpy 均有），不需要本机为 arm64。
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 安装 JS 依赖。--ignore-scripts 跳过 postinstall（Windows 上 pnpm.cjs 调用会失败），
      # 再单独用 @electron/rebuild 按 Electron ABI + 目标架构重建原生模块。
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      # 按目标架构重建原生模块。
      #   - x64：默认架构，沿用历史命令。
      #   - arm64：@electron/rebuild --arch arm64 交叉编译 better-sqlite3；
      #     uiohook-napi 有 win32-arm64 预编译，node-gyp-build 运行期自动选用，无需源码重建。
      - name: Rebuild native modules for Electron
        run: pnpm exec electron-rebuild -f -w better-sqlite3 -w uiohook-napi --arch ${{ matrix.arch }}

      # 下载并准备目标架构的嵌入式 CPython 并装好依赖（两架构统一纯 ONNX 依赖集：
      # numpy + onnxruntime + soundfile，NO torch/funasr）。
      #   - x64：x86_64-pc-windows-msvc-shared install_only，用嵌入式 pip 原生装 win_amd64 轮子。
      #   - arm64：aarch64-pc-windows-msvc install_only（astral-sh，tag 20260623），
      #     宿主机 pip 跨平台拉 win_arm64 轮子（不执行 aarch64 解释器）。
      - name: Prepare embedded Python
        run: node scripts/prepare-embedded-python.js --platform=win32 --arch=${{ matrix.arch }}

      # 校验嵌入式 Python。
      #   - x64：嵌入式解释器与 runner 同架构，可直接执行 → 真实 import 校验纯 ONNX 依赖
      #     （numpy/onnxruntime/soundfile），并断言 torch/funasr 未被误装（瘦身回归红线）。
      #   - arm64：嵌入式是 aarch64 解释器，无法在 x64 runner 上执行（exec format error），
      #     故只做"文件存在性 + site-packages 关键包目录存在"的静态校验。
      #     真正的运行期导入由用户在 ARM 机上验证。
      - name: Verify embedded Python (x64 onnx)
        if: matrix.arch == 'x64'
        shell: pwsh
        run: |
          $py = "python\python.exe"
          if (-not (Test-Path $py)) { Write-Error "FAIL: 嵌入式 python.exe 不存在: $py"; exit 1 }
          $env:PYTHONHOME = (Resolve-Path "python").Path
          $env:PYTHONPATH = (Resolve-Path "python\Lib\site-packages").Path
          $env:PYTHONIOENCODING = "utf-8"
          & $py -c "import numpy, onnxruntime, soundfile; print('onnx deps OK:', 'numpy', numpy.__version__, '| onnxruntime', onnxruntime.__version__)"
          if ($LASTEXITCODE -ne 0) { Write-Error "FAIL: 纯 ONNX 依赖 import 校验失败"; exit 1 }
          # 本地 4B 润色硬依赖：llama-cpp-python（abetlen CPU 轮子）必须可 import。
          & $py -c "import llama_cpp; print('llama_cpp OK:', llama_cpp.__version__)"
          if ($LASTEXITCODE -ne 0) { Write-Error "FAIL: llama_cpp import 校验失败（x64 本地模型润色不可用）"; exit 1 }
          # 瘦身红线：torch/funasr 不应再被打进 x64 包。
          foreach ($bad in @("torch", "funasr")) {
            if (Test-Path (Join-Path "python\Lib\site-packages" $bad)) {
              Write-Error "FAIL: x64 纯 ONNX 包内不应存在 $bad（会导致装机包回胖）"
              exit 1
            }
          }
          Write-Host "x64 纯 ONNX 嵌入式 Python 校验通过（无 torch/funasr，含 llama_cpp）。"

      - name: Verify embedded Python (arm64 static)
        if: matrix.arch == 'arm64'
        shell: pwsh
        run: |
          $py = "python\python.exe"
          if (-not (Test-Path $py)) { Write-Error "FAIL: 嵌入式 python.exe 不存在: $py"; exit 1 }
          Write-Host "OK: $py 存在"
          $site = "python\Lib\site-packages"
          if (-not (Test-Path $site)) { Write-Error "FAIL: site-packages 不存在: $site"; exit 1 }
          # 纯 numpy SenseVoice 引擎依赖：onnxruntime / numpy / soundfile 应已就位。
          # （不含 funasr_onnx —— 其依赖 kaldi-native-fbank/torch 无 win-arm64 轮子，已用自带 numpy 引擎替代。）
          # 注意：包可能是目录(numpy/、onnxruntime/)，也可能是单文件模块(soundfile.py)，
          # 故同时接受 <name>/ 目录、<name>.py 单文件、或 <name>*.dist-info 元数据三种形态。
          $need = @("onnxruntime", "numpy", "soundfile")
          foreach ($n in $need) {
            $asDir = Test-Path (Join-Path $site $n)
            $asFile = Test-Path (Join-Path $site "$n.py")
            $asDist = (Get-ChildItem -Path $site -Filter "$n*.dist-info" -Directory -ErrorAction SilentlyContinue | Measure-Object).Count -gt 0
            if (-not ($asDir -or $asFile -or $asDist)) {
              Write-Error "FAIL: 缺少纯 ONNX 依赖: $n（既无目录/单文件模块/dist-info；torch/funasr_onnx 已按设计排除）"
              exit 1
            }
            Write-Host "OK: 依赖存在 $n (dir=$asDir file=$asFile dist=$asDist)"
          }
          # 确认 torch 未被误装进 arm64 包（应不存在）。
          if (Test-Path (Join-Path $site "torch")) {
            Write-Host "WARN: arm64 包内出现 torch 目录（不应存在，但不致命）"
          }
          # 瘦身红线：llama_cpp 绝不应进 arm64 包（无 win_arm64 轮子，UI 已隐藏本地模型选项）。
          $llamaDir = Test-Path (Join-Path $site "llama_cpp")
          $llamaDist = (Get-ChildItem -Path $site -Filter "llama_cpp_python*.dist-info" -Directory -ErrorAction SilentlyContinue | Measure-Object).Count -gt 0
          if ($llamaDir -or $llamaDist) {
            Write-Error "FAIL: arm64 包内不应存在 llama_cpp（按设计排除，本地模型选项在 UI 层隐藏）"
            exit 1
          }
          Write-Host "arm64 嵌入式 Python 静态校验通过（运行期导入需在 ARM 机验证；无 llama_cpp）。"

      # 模型文件与目标 CPU 架构无关。统一使用仓库中的固定 v2.0.5
      # revision + size + SHA-256 清单，禁止在发版作业中现场导出或跟随浮动快照。
      - name: Prepare pinned SenseVoice ONNX model
        run: pnpm run prepare:sensevoice

      - name: Verify pinned SenseVoice ONNX model
        run: pnpm run verify:sensevoice

      - name: Build renderer (Vite)
        run: pnpm run build:renderer

      # 编译原生按键注入器 sendkeys.exe（纯 Win32 SendInput，零脚本引擎依赖）。
      # 企业策略机 PowerShell 处于 Constrained Language Mode 时 Add-Type / COM 全被禁，
      # 该 exe 是 clipboard.js Windows 按键三级链的最优先路径（①exe → ②PS worker → ③一次性 PS）。
      # arm64 leg 用 amd64_arm64 交叉工具链在 x64 runner 上编出 ARM64 PE。
      # 产物 build/win/sendkeys.exe 由 package.json build.win.extraResources 打进包（resources/bin/sendkeys.exe）。
      - name: Setup MSVC toolchain
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch == 'arm64' && 'amd64_arm64' || 'amd64' }}

      - name: Compile sendkeys.exe (native key injector)
        shell: cmd
        run: cl /nologo /O1 /W3 build\win\sendkeys.c /Fe:build\win\sendkeys.exe /link user32.lib

      - name: Assert sendkeys.exe built
        shell: pwsh
        run: |
          if (-not (Test-Path "build\win\sendkeys.exe")) {
            Write-Error "FAIL: build\win\sendkeys.exe 未生成（MSVC 编译失败？）"
            exit 1
          }
          Write-Host ("OK: sendkeys.exe 已生成（{0} KB）" -f [math]::Round((Get-Item "build\win\sendkeys.exe").Length/1KB, 1))

      # 真正产出 .exe：nsis 安装器 + portable 便携版，按矩阵架构构建。--publish never 不发布到 GitHub。
      # 关键修复（v1.4.6）：package.json 的 build.win.target 显式写了 arch:["x64","arm64"]，
      # 此时 `--win --<arch>` 标志只作「无 arch 目标」的默认值，不会过滤显式 arch 列表——
      # 结果每个矩阵作业都会构建 x64+arm64 两套，x64 作业产出的 arm64 包（内含 x64 python）
      # 与 arm64 作业产出的真 aarch64 包同名，发布时后完成者覆盖前者，arm64 不可信。
      # 用 `nsis:<arch> portable:<arch>` 形式会短路 config 的 target 列表，只构建本作业架构这一套。
      - name: Build Windows installer + portable
        run: pnpm exec electron-builder --win nsis:${{ matrix.arch }} portable:${{ matrix.arch }} --publish never
        env:
          # 关闭代码签名自动发现（CI 无证书）。
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Verify packaged Electron runtime (x64)
        if: matrix.arch == 'x64'
        shell: pwsh
        run: |
          $unpackDir = "dist\win-unpacked"
          $exe = Get-ChildItem -Path $unpackDir -Filter "*.exe" -File |
            Where-Object { $_.Name -notmatch "uninstall" } |
            Select-Object -First 1
          if (-not $exe) { Write-Error "FAIL: 未找到 x64 unpacked Electron 主程序"; exit 1 }
          $result = Join-Path $env:RUNNER_TEMP "wordtaker-packaged-runtime-x64.json"
          $userData = Join-Path $env:RUNNER_TEMP "wordtaker-packaged-user-data-x64"
          $package = Get-Content package.json | ConvertFrom-Json
          $env:WORDTAKER_PACKAGED_RUNTIME_SMOKE = "1"
          $env:WORDTAKER_EXPECTED_APP_VERSION = $package.version
          $env:WORDTAKER_EXPECTED_ELECTRON_VERSION = $package.devDependencies.electron
          $env:WORDTAKER_EXPECTED_ARCH = "x64"
          $env:WORDTAKER_EXPECTED_VARIANT = "default"
          $env:WORDTAKER_RUNTIME_SMOKE_RESULT = $result
          & $exe.FullName "--user-data-dir=$userData"
          if ($LASTEXITCODE -ne 0) { Write-Error "FAIL: x64 packaged runtime smoke failed"; exit 1 }
          node scripts/electron-runtime-smoke.js --verify-result `
            $result $package.devDependencies.electron $package.version "x64" "default"
          if ($LASTEXITCODE -ne 0) { exit 1 }

      # 用同一固定 revision/size/SHA-256 清单复核最终包，不能只检查文件存在。
      # 运行时 funasr_server.py 从「与自身同级的 models/sensevoice/」读取模型，
      # funasrManager 的模型检查也指向同一路径——两头对齐；缺失应在 CI 失败而非上线后发现。
      - name: Assert SenseVoice model packed
        shell: pwsh
        run: |
          $arch = "${{ matrix.arch }}"
          if ($arch -eq "arm64") { $unpackDir = "dist\win-arm64-unpacked" } else { $unpackDir = "dist\win-unpacked" }
          $modelDir = Join-Path $unpackDir "resources\app.asar.unpacked\models\sensevoice"
          node scripts/sensevoice-model.js --verify "--model-dir=$modelDir"
          if ($LASTEXITCODE -ne 0) { Write-Error "FAIL: 安装包 SenseVoice 模型哈希校验失败"; exit 1 }

      # 断言打包进 asar.unpacked 的原生模块/可执行文件确为 Windows PE 且机器类型匹配目标架构。
      #   x64   -> 0x8664(IMAGE_FILE_MACHINE_AMD64)
      #   arm64 -> 0xAA64(IMAGE_FILE_MACHINE_ARM64)
      # 防止错误架构二进制混入（mac/arm64 进 x64 包、或 x64 进 arm64 包）导致 0xc0000017 启动崩溃。
      - name: Assert native modules + python.exe PE machine type
        shell: pwsh
        run: |
          $arch = "${{ matrix.arch }}"
          if ($arch -eq "arm64") {
            $expectMachine = 0xAA64
            $expectName = "arm64(0xAA64)"
            $winDirToken = "win32-arm64"
          } else {
            $expectMachine = 0x8664
            $expectName = "x64(0x8664)"
            $winDirToken = "win32-x64"
          }

          # 关键：必须按目标架构选对解包目录。electron-builder 把 x64 解包到
          # dist\win-unpacked，arm64 解包到 dist\win-arm64-unpacked。即便 arm64 作业里
          # 多 arch nsis 目标也会顺带产出 x64 的 win-unpacked，故这里严格只看本架构的目录，
          # 否则会误读到对方架构的 .node 而误判（曾在 arm64 作业读到 win-unpacked 的 x64 0x8664）。
          if ($arch -eq "arm64") {
            $unpackDir = "dist\win-arm64-unpacked"
          } else {
            $unpackDir = "dist\win-unpacked"
          }
          $root = Join-Path $unpackDir "resources\app.asar.unpacked"
          $resources = Join-Path $unpackDir "resources"
          if (-not (Test-Path $root)) {
            if (Test-Path $resources) { $root = $resources }
            else { Write-Error "FAIL: 未找到本架构解包目录: $unpackDir"; exit 1 }
          }
          Write-Host "目标架构: $arch；解包根目录: $root"

          function Assert-Pe([string]$file, [int]$expect, [string]$expectLabel) {
            $fs = [System.IO.File]::OpenRead($file)
            try {
              $br = New-Object System.IO.BinaryReader($fs)
              # DOS 头：偏移 0 必须是 "MZ"
              $mz = $br.ReadBytes(2)
              if ($mz[0] -ne 0x4D -or $mz[1] -ne 0x5A) {
                Write-Error "FAIL: $file 不是 PE（缺少 MZ 头，疑似 Mach-O/损坏）"
                exit 1
              }
              # e_lfanew 位于偏移 0x3C，4 字节，指向 PE 签名
              $fs.Seek(0x3C, [System.IO.SeekOrigin]::Begin) | Out-Null
              $peOffset = $br.ReadUInt32()
              $fs.Seek($peOffset, [System.IO.SeekOrigin]::Begin) | Out-Null
              $pe = $br.ReadBytes(4)
              if ($pe[0] -ne 0x50 -or $pe[1] -ne 0x45 -or $pe[2] -ne 0 -or $pe[3] -ne 0) {
                Write-Error "FAIL: $file 缺少 PE\0\0 签名（偏移 $peOffset）"
                exit 1
              }
              # 紧跟 PE 签名的是 IMAGE_FILE_HEADER，其首 2 字节是 Machine
              $machine = $br.ReadUInt16()
              $hex = "0x{0:X4}" -f $machine
              Write-Host "$file -> Machine=$hex"
              if ($machine -ne $expect) {
                Write-Error "FAIL: $file 机器类型为 $hex，非 $expectLabel。疑似错误架构二进制混入。"
                exit 1
              }
            } finally {
              $fs.Close()
            }
          }

          # 校验 better-sqlite3。
          $sqliteFiles = Get-ChildItem -Path $root -Recurse -Filter "better_sqlite3.node" -ErrorAction SilentlyContinue
          $sqliteCount = 0
          foreach ($f in $sqliteFiles) { Assert-Pe $f.FullName $expectMachine $expectName; $sqliteCount++ }
          if ($sqliteCount -lt 1) {
            Write-Error "FAIL: 未找到 better_sqlite3.node 进行校验。"
            exit 1
          }

          # 校验 uiohook-napi：只校验“目标架构 Windows 会实际加载”的二进制
          # （win32-<arch> 预编译，或 @electron/rebuild 产出的 build\Release）。
          $allUiohook = Get-ChildItem -Path $root -Recurse -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -eq "uiohook_napi.node" -or $_.Name -eq "uiohook-napi.node" }
          $uiohookWin = $allUiohook | Where-Object {
            $_.FullName.Contains($winDirToken) -or $_.FullName.Contains("build\Release")
          }
          $uiohookForeign = $allUiohook | Where-Object {
            $_.FullName.Contains("darwin") -or $_.FullName.Contains("linux")
          }
          foreach ($f in $uiohookForeign) {
            Write-Host "WARN: 包内含非 Windows uiohook 预编译二进制（冗余）：$($f.FullName)"
          }
          $uiohookCount = 0
          foreach ($f in $uiohookWin) { Assert-Pe $f.FullName $expectMachine $expectName; $uiohookCount++ }
          if ($uiohookCount -lt 1) {
            Write-Error "FAIL: 未找到目标架构（$winDirToken / build\Release）的 uiohook 原生模块进行校验。"
            exit 1
          }
          $checked = $sqliteCount + $uiohookCount

          # 嵌入式 python.exe（打到 resources 下）也必须是目标架构 Windows PE。
          if ($resources -and (Test-Path $resources)) {
            $pyFiles = Get-ChildItem -Path $resources -Recurse -Filter "python.exe" -ErrorAction SilentlyContinue
            if ($pyFiles) {
              foreach ($f in $pyFiles) { Assert-Pe $f.FullName $expectMachine $expectName; $checked++ }
            } else {
              Write-Host "WARN: 未在 $resources 下找到 python.exe（跳过其 PE 校验）"
            }
          }

          Write-Host "$expectName PE 断言通过，共校验 $checked 个文件。"

      - name: Upload ARM64 unpacked app for native-runner verification
        if: matrix.arch == 'arm64'
        uses: actions/upload-artifact@v4
        with:
          name: wordtaker-windows-arm64-unpacked
          if-no-files-found: error
          retention-days: 1
          path: dist/win-arm64-unpacked

      # 计算「本架构」安装包的 SHA256 写入按 arch 命名的校验文件。
      # v1.4.6 加固：只对含本架构 token（-x64- / -arm64-）的 .exe 求和，绝不混入对方架构产物
      # （即使构建步已只产出本架构，这里也按架构过滤作为二次防线）；每作业各写各的文件名，互不覆盖。
      - name: Compute SHA256SUMS for installers
        shell: pwsh
        run: |
          $arch = "${{ matrix.arch }}"
          $installers = Get-ChildItem -Path "dist" -Filter "*.exe" -File -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -like "*-$arch-*" }
          if (-not $installers) {
            Write-Error "FAIL: dist 下未找到本架构($arch) .exe 安装包，无法生成 SHA256SUMS。"
            exit 1
          }
          $lines = @()
          foreach ($f in $installers) {
            $h = (Get-FileHash -Algorithm SHA256 -Path $f.FullName).Hash.ToLower()
            $lines += "$h  $($f.Name)"
            Write-Host "$h  $($f.Name)"
          }
          Set-Content -Path "dist\SHA256SUMS-$arch.txt" -Value $lines -Encoding ascii
          Write-Host "已写入 dist\SHA256SUMS-$arch.txt"

      # 收集「仅本架构」的待发布产物到 publish/ 目录，避免任何对方架构文件被误传到 Release。
      # 关键：electron-builder 的 latest.yml/blockmap 是架构无关命名，两作业会互相覆盖且语义错误，
      # 故 v1.4.6 起不再发布 latest*.yml/blockmap，只发布按架构命名的 setup/portable .exe + 校验文件。
      - name: Stage per-arch release assets
        shell: pwsh
        run: |
          $arch = "${{ matrix.arch }}"
          New-Item -ItemType Directory -Force -Path "publish" | Out-Null
          $assets = Get-ChildItem -Path "dist" -Filter "*.exe" -File -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -like "*-$arch-*" }
          if (-not $assets) {
            Write-Error "FAIL: 没有本架构($arch)的 .exe 可发布。"
            exit 1
          }
          foreach ($f in $assets) {
            Copy-Item $f.FullName "publish\" -Force
            Write-Host "stage: $($f.Name)"
          }
          Copy-Item "dist\SHA256SUMS-$arch.txt" "publish\" -Force
          Write-Host "stage: SHA256SUMS-$arch.txt"
          Write-Host "publish/ 内容:"; Get-ChildItem "publish" | ForEach-Object { Write-Host "  $($_.Name)" }

      # 未签名包仅作验收，短期保存；签名/发布必须由受保护的独立主干流程完成。
      - name: Upload Windows artifacts (short retention)
        uses: actions/upload-artifact@v4
        with:
          name: wordtaker-windows-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 1
          path: |
            publish/*.exe
            publish/SHA256SUMS-${{ matrix.arch }}.txt

  verify-arm64-package:
    needs: build-win
    runs-on: windows-11-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
      - uses: actions/download-artifact@v4
        with:
          name: wordtaker-windows-arm64-unpacked
          path: dist/win-arm64-unpacked
      - name: Verify packaged Electron runtime (ARM64)
        shell: pwsh
        run: |
          $unpackDir = "dist\win-arm64-unpacked"
          $exe = Get-ChildItem -Path $unpackDir -Filter "*.exe" -File |
            Where-Object { $_.Name -notmatch "uninstall" } |
            Select-Object -First 1
          if (-not $exe) { Write-Error "FAIL: 未找到 ARM64 unpacked Electron 主程序"; exit 1 }
          $result = Join-Path $env:RUNNER_TEMP "wordtaker-packaged-runtime-arm64.json"
          $userData = Join-Path $env:RUNNER_TEMP "wordtaker-packaged-user-data-arm64"
          $package = Get-Content package.json | ConvertFrom-Json
          $env:WORDTAKER_PACKAGED_RUNTIME_SMOKE = "1"
          $env:WORDTAKER_EXPECTED_APP_VERSION = $package.version
          $env:WORDTAKER_EXPECTED_ELECTRON_VERSION = $package.devDependencies.electron
          $env:WORDTAKER_EXPECTED_ARCH = "arm64"
          $env:WORDTAKER_EXPECTED_VARIANT = "default"
          $env:WORDTAKER_RUNTIME_SMOKE_RESULT = $result
          & $exe.FullName "--user-data-dir=$userData"
          if ($LASTEXITCODE -ne 0) { Write-Error "FAIL: ARM64 packaged runtime smoke failed"; exit 1 }
          node scripts/electron-runtime-smoke.js --verify-result `
            $result $package.devDependencies.electron $package.version "arm64" "default"
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Verify packaged embedded Python (ARM64)
        shell: pwsh
        run: |
          $pythonRoot = (Resolve-Path "dist\win-arm64-unpacked\resources\app.asar.unpacked\python").Path
          $python = Join-Path $pythonRoot "python.exe"
          if (-not (Test-Path $python)) { Write-Error "FAIL: ARM64 packaged python.exe missing"; exit 1 }
          $env:PYTHONHOME = $pythonRoot
          $env:PYTHONPATH = Join-Path $pythonRoot "Lib\site-packages"
          $env:PYTHONIOENCODING = "utf-8"
          & $python -c "import numpy, onnxruntime, soundfile; print('ARM64 packaged Python OK', numpy.__version__, onnxruntime.__version__)"
          if ($LASTEXITCODE -ne 0) { Write-Error "FAIL: ARM64 packaged Python imports failed"; exit 1 }
