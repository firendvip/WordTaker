name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.3
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      # --ignore-scripts 跳过 electron-builder/原生重建（单测仅依赖纯模块）
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm audit:security
      - run: pnpm run lint
        continue-on-error: true
      - run: pnpm test
      - run: node --test tests/windowsSqliteBinaries.test.cjs
      - run: pnpm test:rollback:coverage

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pytest numpy==1.26.4 scipy==1.17.1 soundfile==0.14.0
      - run: python -m pytest tests/python -q
