name: Accept frozen macOS14 DMG
on:
  # GitHub cannot manually dispatch a new workflow absent from the default branch.
  # Run only this authorized QA branch/path set; never merge into product main to register it.
  push:
    branches: [codex/macos14-acceptance]
    paths:
      - '.github/workflows/accept-macos14-dmg.yml'
      - 'scripts/macos-dmg-guard.cjs'
      - 'scripts/macos-dmg-transport.cjs'
      - 'scripts/macos-signed-dmg.cjs'
      - 'scripts/macos-dmg-acceptance.cjs'
      - 'scripts/macos-host-isolation.cjs'
      - 'scripts/macos-host-network.cjs'
      - 'scripts/macos-readiness-policy.cjs'
      - 'scripts/macos-model-preseed.cjs'
      - 'tests/macOSDmgGuard.test.cjs'
      - 'tests/macOSDmgWorkflow.test.cjs'
      - 'tests/macOSSignedDmg.test.cjs'
      - 'tests/macOSHostIsolation.test.cjs'
      - 'tests/macOSReadinessPolicy.test.cjs'
      - 'tests/macOSModelPreseed.test.cjs'
      - 'tests/macOSBundleIntegrity.test.cjs'
  workflow_dispatch:
    inputs:
      draft_release_id:
        description: Exact unpublished v1.29.5 draft release ID
        required: true
        type: string
      dmg_asset_id:
        description: Exact frozen Mac ARM64 DMG asset ID
        required: true
        type: string
permissions:
  contents: read
jobs:
  accept-existing-dmg:
    if: github.repository == 'firendvip/WordTaker' && github.ref == 'refs/heads/codex/macos14-acceptance' && github.event.repository.fork == false && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: macos-14
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test safety boundaries without product execution
        run: node --test --experimental-test-coverage tests/macOSDmgGuard.test.cjs tests/macOSDmgWorkflow.test.cjs tests/macOSSignedDmg.test.cjs tests/macOSHostIsolation.test.cjs tests/macOSReadinessPolicy.test.cjs tests/macOSModelPreseed.test.cjs tests/macOSBundleIntegrity.test.cjs
      - name: Preflight and download only the exact private draft DMG
        id: transport
        run: node scripts/macos-dmg-transport.cjs "$DRAFT_RELEASE_ID" "$DMG_ASSET_ID"
        env:
          GH_TOKEN: ${{ github.token }}
          WORDTAKER_DMG_URL: ${{ secrets.WORDTAKER_MAC_DMG_ONCE_408254714 }}
          DRAFT_RELEASE_ID: ${{ inputs.draft_release_id || '408254714' }}
          DMG_ASSET_ID: ${{ inputs.dmg_asset_id || '626599706' }}
      - name: A - Accept true first-use download UI and normal lifecycle
        run: node scripts/macos-host-network.cjs --accept "$QA_ROOT"
        env:
          QA_ROOT: ${{ steps.transport.outputs.root }}
          WORDTAKER_MODEL_SCENARIO: unprepared
          WORDTAKER_REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
      - name: Prepare only fixed official model bytes after A exits and network restores
        id: models
        run: node scripts/macos-model-preseed.cjs "$SCENARIO_A_ROOT"
        env:
          SCENARIO_A_ROOT: ${{ steps.transport.outputs.root }}
          WORDTAKER_REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
      - name: B - Accept offline actual full worker and two sequential engines
        run: node scripts/macos-host-network.cjs --accept "$QA_ROOT"
        env:
          QA_ROOT: ${{ steps.models.outputs.root }}
          WORDTAKER_MODEL_SCENARIO: prepared
          WORDTAKER_SCENARIO_A_ROOT: ${{ steps.transport.outputs.root }}
          WORDTAKER_REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
      - name: Preserve test-only evidence, never upload the DMG or installed payload
        if: ${{ always() && steps.transport.outputs.root != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: macos14-dmg-acceptance-evidence-A
          retention-days: 1
          if-no-files-found: warn
          path: |
            ${{ steps.transport.outputs.root }}/TRANSPORT_RESULT.json
            ${{ steps.transport.outputs.root }}/MAC_RUNTIME_ACCEPTANCE.json
            ${{ steps.transport.outputs.root }}/BUNDLE_BEFORE_INVENTORY.json
            ${{ steps.transport.outputs.root }}/BUNDLE_AFTER_INVENTORY.json
            ${{ steps.transport.outputs.root }}/settings.png
            ${{ steps.transport.outputs.root }}/settings-after-model.png
            ${{ steps.transport.outputs.root }}/recorder-before-model.png
            ${{ steps.transport.outputs.root }}/recorder-after-model.png
            ${{ steps.transport.outputs.root }}/MAC_MODEL_DIAGNOSTIC.json
            ${{ steps.transport.outputs.root }}/startup.log
            ${{ steps.transport.outputs.root }}/HOST_GUARD_OBSERVATIONS.json
            ${{ steps.transport.outputs.root }}/HOST_NETWORK_BEFORE.json
            ${{ steps.transport.outputs.root }}/HOST_NETWORK_AFTER.json
            ${{ steps.transport.outputs.root }}/HOST_NETWORK_RESULT.json
            ${{ steps.transport.outputs.root }}/HOST_NETWORK_RESTORED.json
            ${{ steps.transport.outputs.root }}/HOST_NETWORK_WATCHDOG_READY.json
            ${{ steps.transport.outputs.root }}/HOST_NETWORK_WATCHDOG_PROGRESS.json
            ${{ steps.transport.outputs.root }}/network-watchdog.log
      - name: Preserve separate B model-byte receipt and runtime evidence without weights
        if: ${{ always() && steps.models.outputs.root != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: macos14-dmg-acceptance-evidence-B
          retention-days: 1
          if-no-files-found: warn
          path: |
            ${{ steps.models.outputs.root }}/TRANSPORT_RESULT.json
            ${{ steps.models.outputs.root }}/MODEL_PREPARATION.json
            ${{ steps.models.outputs.root }}/MAC_RUNTIME_ACCEPTANCE.json
            ${{ steps.models.outputs.root }}/BUNDLE_BEFORE_INVENTORY.json
            ${{ steps.models.outputs.root }}/BUNDLE_AFTER_INVENTORY.json
            ${{ steps.models.outputs.root }}/settings.png
            ${{ steps.models.outputs.root }}/settings-after-model.png
            ${{ steps.models.outputs.root }}/recorder-before-model.png
            ${{ steps.models.outputs.root }}/recorder-after-model.png
            ${{ steps.models.outputs.root }}/MAC_MODEL_DIAGNOSTIC.json
            ${{ steps.models.outputs.root }}/startup.log
            ${{ steps.models.outputs.root }}/HOST_GUARD_OBSERVATIONS.json
            ${{ steps.models.outputs.root }}/HOST_NETWORK_BEFORE.json
            ${{ steps.models.outputs.root }}/HOST_NETWORK_AFTER.json
            ${{ steps.models.outputs.root }}/HOST_NETWORK_RESULT.json
            ${{ steps.models.outputs.root }}/HOST_NETWORK_RESTORED.json
            ${{ steps.models.outputs.root }}/HOST_NETWORK_WATCHDOG_READY.json
            ${{ steps.models.outputs.root }}/HOST_NETWORK_WATCHDOG_PROGRESS.json
            ${{ steps.models.outputs.root }}/network-watchdog.log
