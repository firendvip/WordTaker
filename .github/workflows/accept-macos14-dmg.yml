name: Accept frozen macOS14 DMG
on:
  # GitHub cannot manually dispatch a new workflow absent from the default branch.
  # Run only this authorized QA branch/path set; never merge into product main to register it.
  push:
    branches: [codex/macos14-acceptance]
    paths:
      - '.github/workflows/accept-macos14-dmg.yml'
      - 'scripts/macos-dmg-guard.cjs'
      - 'scripts/macos-dmg-transport.cjs'
      - 'scripts/macos-dmg-acceptance.cjs'
      - 'tests/macOSDmgGuard.test.cjs'
      - 'tests/macOSDmgWorkflow.test.cjs'
  workflow_dispatch:
    inputs:
      draft_release_id:
        description: Exact unpublished v1.29.5 draft release ID
        required: true
        type: string
      dmg_asset_id:
        description: Exact frozen Mac ARM64 DMG asset ID
        required: true
        type: string
permissions:
  contents: read
jobs:
  accept-existing-dmg:
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test safety boundaries without product execution
        run: node --test --experimental-test-coverage tests/macOSDmgGuard.test.cjs tests/macOSDmgWorkflow.test.cjs
      - name: Preflight and download only the exact private draft DMG
        id: transport
        run: node scripts/macos-dmg-transport.cjs "$DRAFT_RELEASE_ID" "$DMG_ASSET_ID"
        env:
          GH_TOKEN: ${{ github.token }}
          DRAFT_RELEASE_ID: ${{ inputs.draft_release_id || '408254714' }}
          DMG_ASSET_ID: ${{ inputs.dmg_asset_id || '625938591' }}
      - name: Accept the actual installed product entry without granting permissions
        run: node scripts/macos-dmg-acceptance.cjs "$QA_ROOT"
        env:
          QA_ROOT: ${{ steps.transport.outputs.root }}
      - name: Preserve test-only evidence, never upload the DMG or installed payload
        if: ${{ always() && steps.transport.outputs.root != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: macos14-dmg-acceptance-evidence
          retention-days: 1
          if-no-files-found: warn
          path: |
            ${{ steps.transport.outputs.root }}/TRANSPORT_RESULT.json
            ${{ steps.transport.outputs.root }}/MAC_RUNTIME_ACCEPTANCE.json
            ${{ steps.transport.outputs.root }}/settings.png
            ${{ steps.transport.outputs.root }}/startup.log
