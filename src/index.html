<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="../assets/icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>弦外小猫</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Helvetica Neue', Helvetica, Arial, sans-serif;
        background: transparent;
        overflow: hidden;
      }
      
      #root {
        width: 100vw;
        height: 100vh;
        background: transparent;
      }
      
      /* 中文字体优化 */
      .chinese-text {
        font-family: 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'WenQuanYi Micro Hei', sans-serif;
        line-height: 1.6;
        letter-spacing: 0.02em;
      }
      
      /* 防止文本选择 */
      .no-select {
        -webkit-user-select: none;
        -moz-user-select: none;
        -ms-user-select: none;
        user-select: none;
      }
      
      /* 自定义滚动条 */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      
      ::-webkit-scrollbar-track {
        background: rgba(0, 0, 0, 0.1);
        border-radius: 3px;
      }
      
      ::-webkit-scrollbar-thumb {
        background: rgba(0, 0, 0, 0.3);
        border-radius: 3px;
      }
      
      ::-webkit-scrollbar-thumb:hover {
        background: rgba(0, 0, 0, 0.5);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // 最早期错误上报（Windows 白屏排查）：module 脚本求值阶段抛错时 React 还没挂载，
      // main.jsx 里的错误处理来不及注册。这段普通内联脚本先于 module 执行，
      // 把任何未捕获错误/未处理 rejection 经 preload 的 log 通道报回主进程日志。
      (function () {
        function report(kind, message) {
          try {
            if (window.electronAPI && window.electronAPI.log) {
              window.electronAPI.log('error', '[renderer-early] ' + kind + ': ' + message);
            }
          } catch (e) { /* 上报失败静默 */ }
        }
        window.addEventListener('error', function (ev) {
          report('error', (ev.error && ev.error.stack) || ev.message || 'unknown');
        });
        window.addEventListener('unhandledrejection', function (ev) {
          var r = ev.reason;
          report('unhandledrejection', (r && r.stack) || String(r));
        });
      })();
    </script>
    <script type="module" src="/main.jsx"></script>
  </body>
</html>
